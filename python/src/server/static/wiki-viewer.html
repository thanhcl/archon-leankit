<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wiki KB Viewer</title>
<script src="https://unpkg.com/vis-network@9.1.6/standalone/umd/vis-network.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<style>
:root{--bg:#0d1117;--surface:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#58a6ff;--green:#3fb950;--purple:#d2a8ff;--orange:#f0883e;--pink:#f778ba;--red:#f85149}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
.app{display:grid;grid-template-rows:auto 1fr auto;height:100vh}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:16px}
header h1{font-size:18px;font-weight:600;color:var(--accent)}
header select,header input{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:6px;font-size:13px}
header input{width:240px}
.main{display:grid;grid-template-columns:280px 1fr 280px;overflow:hidden}
.panel{border-right:1px solid var(--border);overflow-y:auto;padding:12px}
.panel:last-child{border-right:none;border-left:1px solid var(--border)}
.panel h2{font-size:13px;color:var(--text2);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.page-item{padding:8px 10px;border-radius:6px;cursor:pointer;margin-bottom:4px;border:1px solid transparent}
.page-item:hover{background:var(--surface);border-color:var(--border)}
.page-item.active{background:var(--surface);border-color:var(--accent)}
.page-item .title{font-size:14px;font-weight:500}
.page-item .meta{font-size:11px;color:var(--text2);margin-top:2px}
.badge{display:inline-block;padding:1px 6px;border-radius:10px;font-size:10px;font-weight:600}
.badge-entity{background:#1f3a2e;color:var(--green)}
.badge-concept{background:#2d1f3a;color:var(--purple)}
.badge-synthesis{background:#3a1f2e;color:var(--pink)}
.badge-source{background:#3a2e1f;color:var(--orange)}
.content{overflow-y:auto;padding:24px 32px}
.content h1{font-size:24px;margin-bottom:4px}
.content .page-meta{color:var(--text2);font-size:13px;margin-bottom:16px;display:flex;gap:12px;flex-wrap:wrap}
.content .markdown{line-height:1.7}
.content .markdown h1,.content .markdown h2,.content .markdown h3{margin-top:20px;margin-bottom:8px}
.content .markdown p{margin-bottom:12px}
.content .markdown code{background:var(--surface);padding:2px 6px;border-radius:4px;font-size:13px}
.content .markdown pre{background:var(--surface);padding:16px;border-radius:8px;overflow-x:auto;margin-bottom:12px}
.content .markdown ul,.content .markdown ol{padding-left:24px;margin-bottom:12px}
.link-item{padding:6px 8px;border-radius:4px;cursor:pointer;margin-bottom:2px;font-size:13px;display:flex;align-items:center;gap:6px}
.link-item:hover{background:var(--surface)}
.link-item .arrow{color:var(--text2);font-size:11px}
.link-item .conf{font-size:10px;color:var(--text2)}
#graph{height:300px;border-bottom:1px solid var(--border);background:var(--surface)}
footer{background:var(--surface);border-top:1px solid var(--border);padding:8px 20px;font-size:12px;color:var(--text2);display:flex;gap:20px}
footer .stat{display:flex;gap:4px}
footer .stat b{color:var(--text)}
.tabs{display:flex;gap:4px;margin-left:auto}
.tab{padding:4px 12px;border-radius:4px;cursor:pointer;font-size:13px;color:var(--text2)}
.tab:hover{background:var(--bg)}
.tab.active{background:var(--accent);color:#fff}
.empty{text-align:center;padding:40px;color:var(--text2)}
.quality-bar{height:3px;border-radius:2px;background:var(--border);margin-top:4px;overflow:hidden}
.quality-bar span{display:block;height:100%;background:var(--green);border-radius:2px}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Wiki KB</h1>
    <select id="projectSelect"><option value="">Loading projects...</option></select>
    <input id="searchInput" type="text" placeholder="Search pages...">
    <div class="tabs">
      <div class="tab active" data-view="pages" onclick="switchView('pages')">Pages</div>
      <div class="tab" data-view="graph" onclick="switchView('graph')">Graph</div>
    </div>
  </header>
  <div class="main" id="pagesView">
    <div class="panel" id="pageList"><h2>Pages</h2><div class="empty">Select a project</div></div>
    <div class="content" id="pageContent"><div class="empty">Select a page to view</div></div>
    <div class="panel" id="linksPanel"><h2>Links</h2><div class="empty">No page selected</div></div>
  </div>
  <div class="main" id="graphView" style="display:none;grid-template-columns:1fr">
    <div id="graph"></div>
  </div>
  <footer id="statusBar">
    <span class="stat">Pages: <b id="statPages">0</b></span>
    <span class="stat">Links: <b id="statLinks">0</b></span>
    <span class="stat">Communities: <b id="statComm">0</b></span>
    <span class="stat">Orphans: <b id="statOrphans">0</b></span>
    <span class="stat">God Nodes: <b id="statGods">0</b></span>
  </footer>
</div>
<script>
const API = '/api';
let allPages = [], currentPage = null, graphNetwork = null, lintData = null;

async function api(path) {
  const r = await fetch(API + path);
  return r.ok ? r.json() : null;
}

async function loadProjects() {
  const d = await api('/projects');
  const sel = document.getElementById('projectSelect');
  sel.innerHTML = '<option value="">-- Select Project --</option>';
  const projects = d?.projects || d || [];
  projects.forEach(p => {
    const o = document.createElement('option');
    o.value = p.id; o.textContent = p.title;
    sel.appendChild(o);
  });
  sel.onchange = () => { if(sel.value) loadProject(sel.value); };
}

async function loadProject(pid) {
  const [pages, graph, communities, lint] = await Promise.all([
    api(`/wiki/pages?project_id=${pid}&limit=500`),
    api(`/wiki/graph?project_id=${pid}`),
    api(`/wiki/communities/${pid}`),
    fetch(API+`/wiki/lint/${pid}`, {method:'POST'}).then(r=>r.json()).catch(()=>null)
  ]);
  allPages = pages?.pages || [];
  lintData = lint;
  renderPageList(allPages);
  renderGraph(graph);
  renderStats(allPages, graph, communities, lint);
}

function renderPageList(pages) {
  const el = document.getElementById('pageList');
  if (!pages.length) { el.innerHTML = '<h2>Pages</h2><div class="empty">No pages</div>'; return; }
  let html = '<h2>Pages (' + pages.length + ')</h2>';
  pages.forEach(p => {
    const tags = parseTags(p.tags);
    const q = (p.quality_score||0)*100;
    html += `<div class="page-item" onclick="loadPage('${p.id}')" id="pi-${p.id}">
      <div class="title">${esc(p.title)}</div>
      <div class="meta"><span class="badge badge-${p.page_type}">${p.page_type}</span> ${p.community?'<span class="badge badge-concept">'+esc(p.community)+'</span>':''}</div>
      <div class="quality-bar"><span style="width:${q}%"></span></div>
    </div>`;
  });
  el.innerHTML = html;
}

async function loadPage(id) {
  document.querySelectorAll('.page-item').forEach(e=>e.classList.remove('active'));
  const el = document.getElementById('pi-'+id);
  if(el) el.classList.add('active');
  const p = await api(`/wiki/pages/${id}?include_links=true`);
  if(!p) return;
  currentPage = p;
  const tags = parseTags(p.tags);
  const md = typeof marked?.parse === 'function' ? marked.parse(p.content||'') : (p.content||'');
  document.getElementById('pageContent').innerHTML = `
    <h1>${esc(p.title)}</h1>
    <div class="page-meta">
      <span class="badge badge-${p.page_type}">${p.page_type}</span>
      ${p.category?'<span>'+esc(p.category)+'</span>':''}
      ${p.community?'<span>Community: '+esc(p.community)+'</span>':''}
      ${tags.map(t=>'<span>#'+esc(t)+'</span>').join('')}
      <span>Quality: ${((p.quality_score||0)*100).toFixed(0)}%</span>
    </div>
    <div class="markdown">${md}</div>`;
  renderLinks(p.links||{});
}

function renderLinks(links) {
  const el = document.getElementById('linksPanel');
  const out = links.outbound||[], inc = links.inbound||[];
  if(!out.length && !inc.length) { el.innerHTML='<h2>Links</h2><div class="empty">No links</div>'; return; }
  let html = '';
  if(out.length) {
    html += '<h2>Outbound (' + out.length + ')</h2>';
    out.forEach(l => {
      const target = allPages.find(p=>p.id===l.to_page_id);
      html += `<div class="link-item" onclick="loadPage('${l.to_page_id}')">
        <span class="arrow">&rarr;</span> ${esc(target?.title||l.to_page_id.slice(0,8))}
        <span class="conf">${l.link_type} (${l.confidence||'?'})</span>
      </div>`;
    });
  }
  if(inc.length) {
    html += '<h2>Inbound (' + inc.length + ')</h2>';
    inc.forEach(l => {
      const source = allPages.find(p=>p.id===l.from_page_id);
      html += `<div class="link-item" onclick="loadPage('${l.from_page_id}')">
        <span class="arrow">&larr;</span> ${esc(source?.title||l.from_page_id.slice(0,8))}
        <span class="conf">${l.link_type} (${l.confidence||'?'})</span>
      </div>`;
    });
  }
  el.innerHTML = html;
}

function renderGraph(data) {
  if(!data||!data.nodes) return;
  const colors = {'entity':'#3fb950','concept':'#d2a8ff','synthesis':'#f778ba','source_summary':'#f0883e'};
  const nodes = new vis.DataSet(data.nodes.map(n=>({
    id:n.id, label:n.title, color:colors[n.page_type]||'#58a6ff',
    font:{color:'#e6edf3',size:12}, shape:'dot', size:10
  })));
  const edges = new vis.DataSet(data.edges.map(e=>({
    from:e.from, to:e.to, color:{color:'#30363d'}, arrows:'to',
    title:e.type, width:Math.max(1,(e.strength||0.5)*3)
  })));
  const container = document.getElementById('graph');
  if(graphNetwork) graphNetwork.destroy();
  graphNetwork = new vis.Network(container, {nodes,edges}, {
    physics:{solver:'forceAtlas2Based',forceAtlas2Based:{gravitationalConstant:-40}},
    interaction:{hover:true,tooltipDelay:100}
  });
  graphNetwork.on('click', p => { if(p.nodes.length) loadPage(p.nodes[0]); switchView('pages'); });
}

function renderStats(pages, graph, communities, lint) {
  document.getElementById('statPages').textContent = pages.length;
  document.getElementById('statLinks').textContent = graph?.edges?.length||0;
  document.getElementById('statComm').textContent = communities?.total_communities||0;
  document.getElementById('statOrphans').textContent = lint?.stats?.orphans||0;
  document.getElementById('statGods').textContent = lint?.stats?.god_nodes||0;
}

function switchView(v) {
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===v));
  document.getElementById('pagesView').style.display = v==='pages'?'grid':'none';
  document.getElementById('graphView').style.display = v==='graph'?'grid':'none';
  if(v==='graph'&&graphNetwork) setTimeout(()=>graphNetwork.fit(),100);
}

function parseTags(t) {
  if(!t) return [];
  if(Array.isArray(t)) return t;
  try{const p=JSON.parse(t);return Array.isArray(p)?p:[];}catch{return[];}
}
function esc(s){return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'):'';}

document.getElementById('searchInput').addEventListener('input', e => {
  const q = e.target.value.toLowerCase();
  const filtered = q ? allPages.filter(p=>p.title.toLowerCase().includes(q)||parseTags(p.tags).some(t=>t.toLowerCase().includes(q))) : allPages;
  renderPageList(filtered);
});

loadProjects();
</script>
</body>
</html>
